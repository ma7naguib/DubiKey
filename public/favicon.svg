<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4a000"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="url(#goldGradient)" stroke-width="3"/>
  <!-- Key icon -->
  <g fill="url(#goldGradient)">
    <!-- Key head (circle) -->
    <circle cx="50" cy="32" r="14" fill="none" stroke="url(#goldGradient)" stroke-width="5"/>
    <!-- Key shaft -->
    <rect x="47" y="44" width="6" height="32" rx="2"/>
    <!-- Key teeth -->
    <rect x="53" y="58" width="10" height="5" rx="1"/>
    <rect x="53" y="68" width="7" height="5" rx="1"/>
  </g>
</svg>
